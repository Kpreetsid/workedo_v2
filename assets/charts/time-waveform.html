<!DOCTYPE html>
<html>

<head>
	<!-- 🔒 Disable WebView zoom -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<!-- Chart.js -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

	<!-- Gesture + Zoom -->
	<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			overflow: hidden;
		}

		#wrapper {
			position: relative;
			height: 100%;
			width: 100%;
		}

		canvas {
			width: 100%;
			height: 100%;
			touch-action: none;
			/* 🔴 critical: prevent WebView zoom */
		}

		.chart-tooltip {
			position: absolute;
			top: 8px;
			/* 🔴 always visible */
			left: 50%;
			transform: translateX(-50%);
			background: #ffffff;
			border-radius: 12px;
			padding: 14px 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
			pointer-events: none;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			font-size: 14px;
			color: #45515C;
			min-width: 220px;
			z-index: 10;
		}

		.tooltip-title {
			font-size: 12px;
			font-weight: 500;
			margin-bottom: 10px;
		}

		.tooltip-row {
			display: flex;
			align-items: center;
			margin-bottom: 6px;
		}

		.tooltip-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			margin-right: 10px;
		}

		.tooltip-label {
			flex: 1;
			font-size: 12px;
		}

		.tooltip-value {
			font-size: 12px;
			font-weight: 500;
		}
	</style>
</head>

<body>
	<div id="wrapper">
		<canvas id="chart"></canvas>
	</div>

	<script>
		let chart;
		let tooltipVisible = false;

		function createWaveform(payload) {
			const ctx = document.getElementById("chart").getContext("2d");
			const fs = payload.datasets[0].fs;
			const maxY = Math.max(
				0,
				...payload.datasets.flatMap(ds => ds.data || [])
			);
			const yAxisMax = maxY > 0 ? maxY * 1.2 : undefined;

			const datasets = payload.datasets.map(ds => {
				const points = ds.data.map((y, i) => ({
					x: i / fs,
					y
				}));

				return {
					label: ds.axis,
					data: points,
					borderColor: ds.color,
					borderWidth: 1,
					pointRadius: 0,
					tension: 0
				};
			});

			chart = new Chart(ctx, {
				type: "line",
				data: { datasets },
				options: {
					responsive: true,
					maintainAspectRatio: false,
					parsing: false,
					animation: false,

					padding: {
						top: 80
					},

					interaction: {
						mode: "index",
						intersect: false
					},

					onClick: (evt, elements) => {
						if (!elements.length) return;

						const el = elements[0];
						const dataset = chart.data.datasets[el.datasetIndex];
						const point = dataset.data[el.index];

						window.ReactNativeWebView?.postMessage(
							JSON.stringify({
								type: "POINT_TAP",
								payload: {
									x: point.x,
									y: point.y,
									axis: dataset.label
								}
							})
						);
					},

					scales: {
						x: {
							type: "linear",
							title: { display: true, text: "Time (s)" },
							grid: { display: false }
						},
						y: {
							title: { display: true, text: payload.yLabel || "" },
							suggestedMax: yAxisMax
						}
					},

					plugins: {
						tooltip: {
							enabled: false,
							mode: "index",      // 🔴 critical
							intersect: false,
							external: function (context) {
								const { chart, tooltip } = context;
								tooltipVisible = true;

								const tooltipEl = getOrCreateTooltip(chart);

								if (tooltip.opacity === 0) {
									tooltipEl.style.opacity = 0;
									tooltipVisible = false;
									return;
								}

								// X value (time)
								const time = Number(tooltip.title[0]).toFixed(4);

								let html = `<div class="tooltip-title">${time}</div>`;

								tooltip.dataPoints.forEach(dp => {
									html += `
          <div class="tooltip-row">
            <div class="tooltip-dot" style="background:${dp.dataset.borderColor}"></div>
            <div class="tooltip-label">${dp.dataset.label}</div>
            <div class="tooltip-value">${dp.raw.y.toFixed(4)}</div>
          </div>
        `;
								});

								tooltipEl.innerHTML = html;

								const { offsetLeft, offsetTop } = chart.canvas;
								tooltipEl.style.opacity = 1;
								// tooltipEl.style.left = offsetLeft + tooltip.caretX + "px";
								// tooltipEl.style.top =
								// 	offsetTop + tooltip.caretY - tooltipEl.offsetHeight - 10 + "px";
							}
						},

						legend: {
							display: true,
							position: "top",
							align: "center",

							labels: {
								color: "#45515C",
								font: {
									family: "system-ui, -apple-system, BlinkMacSystemFont",
									size: 12,
									weight: "500",
								},

								boxWidth: 10,
								boxHeight: 10,
								padding: 16,

								usePointStyle: true,   // 👈 circle instead of square
								pointStyle: "circle",
							},
						},
						zoom: {
							pan: { enabled: true, mode: "x" },
							zoom: {
								pinch: { enabled: true },
								wheel: { enabled: false },
								mode: "x"
							}
						}
					}
				}
			});
		}

		function getOrCreateTooltip(chart) {
			let tooltipEl = chart.canvas.parentNode.querySelector(".chart-tooltip");

			if (!tooltipEl) {
				tooltipEl = document.createElement("div");
				tooltipEl.className = "chart-tooltip";
				chart.canvas.parentNode.appendChild(tooltipEl);
			}

			return tooltipEl;
		}

		function hideTooltip() {
			const tooltipEl = document.querySelector(".chart-tooltip");
			if (tooltipEl) {
				tooltipEl.style.opacity = 0;
			}
		}

		function handleMessage(event) {
			let payload;
			try {
				payload = JSON.parse(event.data);
			} catch {
				return;
			}

			if (payload.type === "HIDE_TOOLTIP") {
				hideTooltip();
				return;
			}

			if (payload.type === "time") {
				if (chart) chart.destroy();
				createWaveform(payload);
			}
		}

		document.addEventListener("click", (e) => {
			if (!chart) return;

			const tooltipEl = chart.canvas.parentNode.querySelector(".chart-tooltip");
			if (!tooltipEl) return;

			// If click happened on the canvas, ignore (chart handles it)
			if (e.target.tagName === "CANVAS") return;

			// Otherwise hide tooltip
			tooltipEl.style.opacity = 0;
			tooltipVisible = false;
		});

		// 🔴 Required for React Native WebView
		document.addEventListener("message", handleMessage);
		window.addEventListener("message", handleMessage);
	</script>
</body>

</html>
