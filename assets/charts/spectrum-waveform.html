<!DOCTYPE html>
<html>

<head>
	<!-- 🔒 Disable WebView zoom -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<!-- Chart.js -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

	<!-- Gesture + Zoom -->
	<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			overflow: hidden;
		}

		#wrapper {
			position: relative;
			height: 100%;
			width: 100%;
		}

		canvas {
			width: 100%;
			height: 100%;
			touch-action: none;
			/* 🔴 critical: prevent WebView zoom */
		}
	</style>
</head>

<body>
	<div id="wrapper">
		<canvas id="chart"></canvas>
	</div>

	<script>
		let chart;

		function createWaveform(payload) {
			const ctx = document.getElementById("chart").getContext("2d");

			const amplitude = payload.amplitude; // e.g. Vertical[]
			const xAxis = payload.xAxis;         // x_axis_spectrum_data[]
			const yLabel = payload.yLabel || "Amplitude";

			if (!Array.isArray(amplitude) || !Array.isArray(xAxis)) {
				console.warn("Invalid spectrum payload", payload);
				return;
			}

			const points = amplitude.map((y, i) => ({
				x: xAxis[i],
				y
			}));

			if (chart) chart.destroy();

			chart = new Chart(ctx, {
				type: "line",
				data: {
					datasets: [
						{
							label: payload.axis || "Spectrum",
							data: points,
							borderColor: "#1e3cff",
							borderWidth: 1,
							pointRadius: 0,
							tension: 0
						}
					]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					parsing: false,
					animation: false,

					interaction: {
						mode: "nearest",
						intersect: false
					},

					scales: {
						x: {
							type: "linear",
							title: {
								display: true,
								text: "Hz"
							},
							ticks: {
								maxTicksLimit: 10
							},
							grid: {
								display: false
							}
						},
						y: {
							title: {
								display: true,
								text: yLabel
							}
						}
					},

					plugins: {
						legend: { display: false },
						zoom: {
							pan: {
								enabled: true,
								mode: "x"
							},
							zoom: {
								pinch: { enabled: true },
								wheel: { enabled: false },
								mode: "x"
							}
						}
					}
				}
			});
		}

		function handleMessage(event) {
			let payload;
			try {
				payload = JSON.parse(event.data);
			} catch {
				return;
			}

			if (payload.type === "spectrum") {
				if (chart) chart.destroy();
				createWaveform(payload);
			}
		}

		// 🔴 Required for React Native WebView
		document.addEventListener("message", handleMessage);
		window.addEventListener("message", handleMessage);
	</script>
</body>

</html>
