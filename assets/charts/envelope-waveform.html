<!DOCTYPE html>
<html>

<head>
	<!-- 🔒 Disable WebView zoom -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<!-- Chart.js -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

	<!-- Gesture + Zoom -->
	<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			overflow: hidden;
		}

		#wrapper {
			position: relative;
			height: 100%;
			width: 100%;
		}

		canvas {
			width: 100%;
			height: 100%;
			touch-action: none;
			/* 🔴 critical: prevent WebView zoom */
		}
	</style>
</head>

<body>
	<div id="wrapper">
		<canvas id="chart"></canvas>
	</div>

	<script>
		let chart;

		function createEnvelope(payload) {
			const ctx = document.getElementById("chart").getContext("2d");
			const datasets = payload.data;
			const yLabel = payload.yLabel || "";

			if (!Array.isArray(datasets) || datasets.length === 0) return;
			const maxY = Math.max(0, ...datasets.flatMap(ds => ds.data || []));
			const yAxisMax = maxY > 0 ? maxY * 1.2 : undefined;

			// All axes share same fs (assumed)
			const fs = datasets[0].fs;

			const chartDatasets = datasets.map(ds => ({
				label: ds.axis,
				data: ds.data.map((y, i) => ({
					x: i / fs,
					y
				})),
				borderColor: ds.color,
				borderWidth: 1,
				pointRadius: 0,
				tension: 0
			}));

			if (chart) chart.destroy();

			chart = new Chart(ctx, {
				type: "line",
				data: { datasets: chartDatasets },
				options: {
					responsive: true,
					maintainAspectRatio: false,
					parsing: false,
					animation: false,

					interaction: {
						mode: "nearest",
						intersect: false
					},

					scales: {
						x: {
							type: "linear",
							title: {
								display: true,
								text: "Time (s)"
							},
							grid: { display: false }
						},
						y: {
							title: {
								display: true,
								text: yLabel
							},
							suggestedMax: yAxisMax
						}
					},

					plugins: {
						legend: {
							display: true,
							position: "top",
							align: "center",

							labels: {
								color: "#45515C",
								font: {
									family: "system-ui, -apple-system, BlinkMacSystemFont",
									size: 12,
									weight: "500",
								},

								boxWidth: 10,
								boxHeight: 10,
								padding: 16,

								usePointStyle: true,   // 👈 circle instead of square
								pointStyle: "circle",
							},
						},
						zoom: {
							pan: { enabled: true, mode: "x" },
							zoom: {
								pinch: { enabled: true },
								wheel: { enabled: false },
								mode: "x"
							}
						}
					}
				}
			});
		}

		function handleMessage(event) {
			let payload;
			try {
				payload = JSON.parse(event.data);
			} catch {
				return;
			}

			if (payload.type === "time") {
				createEnvelope(payload);
			}
		}

		document.addEventListener("message", handleMessage);
		window.addEventListener("message", handleMessage);
	</script>

</body>

</html>
