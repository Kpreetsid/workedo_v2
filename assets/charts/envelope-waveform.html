<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<!-- Chart.js -->
	<script src="vendor/chart.umd.js"></script>

	<!-- Gesture + Zoom -->
	<script src="vendor/hammer.min.js"></script>
	<script src="vendor/chartjs-plugin-zoom.min.js"></script>

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			overflow: hidden;
			touch-action: none;
		}

		#wrapper {
			position: relative;
			height: 100%;
			width: 100%;
		}

		canvas {
			width: 100%;
			height: 100%;
			touch-action: none;
			/* 🔴 critical: prevent WebView zoom */
		}

		.chart-tooltip {
			position: absolute;
			top: 8px;
			left: 50%;
			transform: translateX(-50%);
			background: #ffffff;
			border-radius: 12px;
			padding: 14px 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
			pointer-events: auto;
			font-family: system-ui, -apple-system, BlinkMacSystemFont;
			color: #45515C;
			min-width: 220px;
			z-index: 10;
		}

		.tooltip-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin-bottom: 10px;
		}

		.tooltip-title {
			font-size: 12px;
			font-weight: 500;
			margin-bottom: 0;
		}

		.tooltip-close {
			border: 0;
			background: transparent;
			font-size: 14px;
			font-weight: 700;
			line-height: 1;
			color: #45515C;
			cursor: pointer;
			padding: 0;
		}

		.tooltip-row {
			display: flex;
			align-items: center;
			margin-bottom: 6px;
		}

		.tooltip-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			margin-right: 10px;
		}

		.tooltip-label {
			flex: 1;
			font-size: 12px;
		}

		.tooltip-value {
			font-size: 12px;
			font-weight: 500;
		}
	</style>
</head>

<body>
	<div id="wrapper">
		<canvas id="chart"></canvas>
	</div>

	<script>
		let chart;
		let tooltipVisible = false;

		function createEnvelope(payload) {
			const ctx = document.getElementById("chart").getContext("2d");
			const datasets = payload.data;
			const yLabel = payload.yLabel || "";

			if (!Array.isArray(datasets) || datasets.length === 0) return;
			const maxY = Math.max(0, ...datasets.flatMap(ds => ds.data || []));
			const yAxisMax = maxY > 0 ? maxY * 1.2 : undefined;

			// All axes share same fs (assumed)
			const fs = datasets[0].fs;

			const chartDatasets = datasets.map(ds => ({
				label: ds.axis,
				data: ds.data.map((y, i) => ({
					x: i / fs,
					y
				})),
				borderColor: ds.color,
				borderWidth: 1,
				pointRadius: 0,
				tension: 0
			}));

			if (chart) chart.destroy();

			chart = new Chart(ctx, {
				type: "line",
				data: { datasets: chartDatasets },
				options: {
					responsive: true,
					maintainAspectRatio: false,
					parsing: false,
					animation: false,

					interaction: {
						mode: "index",
						intersect: false
					},

					scales: {
						x: {
							type: "linear",
							title: {
								display: true,
								text: "Time (s)"
							},
							grid: { display: false }
						},
						y: {
							title: {
								display: true,
								text: yLabel
							},
							suggestedMax: yAxisMax
						}
					},

					plugins: {
						tooltip: {
							enabled: false,
							mode: "index",
							intersect: false,
							external(context) {
								const { chart, tooltip } = context;
								const tooltipEl = getOrCreateTooltip(chart);
								tooltipVisible = true;

								if (tooltip.opacity === 0) {
									tooltipEl.style.opacity = 0;
									tooltipVisible = false;
									return;
								}

								const time = Number(tooltip.title[0]).toFixed(4);
								let html = `
        <div class="tooltip-header">
          <div class="tooltip-title">${time}</div>
          <button class="tooltip-close" id="tooltip-close" aria-label="Close tooltip">×</button>
        </div>
      `;

								tooltip.dataPoints.forEach(dp => {
									html += `
        <div class="tooltip-row">
          <div class="tooltip-dot" style="background:${dp.dataset.borderColor}"></div>
          <div class="tooltip-label">${dp.dataset.label}</div>
          <div class="tooltip-value">${dp.raw.y.toFixed(4)}</div>
        </div>
      `;
								});

								tooltipEl.innerHTML = html;
								const closeBtn = tooltipEl.querySelector("#tooltip-close");
								if (closeBtn) {
									closeBtn.onclick = (event) => {
										event.preventDefault();
										event.stopPropagation();
										hideTooltip();
									};
								}
								tooltipEl.style.opacity = 1;
							}
						},
						legend: {
							display: true,
							position: "top",
							align: "center",

							labels: {
								color: "#45515C",
								font: {
									family: "system-ui, -apple-system, BlinkMacSystemFont",
									size: 12,
									weight: "500",
								},

								boxWidth: 10,
								boxHeight: 10,
								padding: 16,

								usePointStyle: true,   // 👈 circle instead of square
								pointStyle: "circle",
							},
						},
						zoom: {
							pan: { enabled: true, mode: "x" },
							zoom: {
								pinch: { enabled: true },
								wheel: { enabled: false },
								mode: "x"
							}
						},

						zoom: {
							pan: { enabled: true, mode: "x" },
							zoom: {
								pinch: { enabled: true },
								wheel: { enabled: false },
								mode: "x"
							}
						}
					}
				}
			});
		}

		function getOrCreateTooltip(chart) {
			let el = chart.canvas.parentNode.querySelector(".chart-tooltip");
			if (!el) {
				el = document.createElement("div");
				el.className = "chart-tooltip";
				chart.canvas.parentNode.appendChild(el);
			}
			return el;
		}

		function hideTooltip() {
			const el = document.querySelector(".chart-tooltip");
			if (el) el.style.opacity = 0;
			tooltipVisible = false;
		}

		function handleMessage(event) {
			let payload;
			try {
				payload = JSON.parse(event.data);
			} catch {
				return;
			}

			if (payload.type === "HIDE_TOOLTIP") {
				hideTooltip();
				return;
			}

			if (payload.type === "time") {
				createEnvelope(payload);
			}
		}

		document.addEventListener("click", (e) => {
			if (!chart) return;

			const tooltipEl = chart.canvas.parentNode.querySelector(".chart-tooltip");
			if (!tooltipEl) return;

			// If click happened on the canvas, ignore (chart handles it)
			if (e.target.tagName === "CANVAS") return;
			if (tooltipEl.contains(e.target)) return;

			// Otherwise hide tooltip
			tooltipEl.style.opacity = 0;
			tooltipVisible = false;
		});

		document.addEventListener("message", handleMessage);
		window.addEventListener("message", handleMessage);
	</script>

</body>

</html>
